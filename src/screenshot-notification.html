<!DOCTYPE html>
<html lang="zh-cn"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

  <title>截图通知</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }
    /* 外层：只负责定位 + 进出场动画，本身不缩放 */
    .stage {
      position: fixed;
      left: 18px;
      top: 18px;
      opacity: 0;
      transform: translateX(-60%) scale(0.98);
      animation: fadeInRight 0.4s cubic-bezier(.4,1.7,.6,1) forwards;
    }
    /* 右上角显示：从右侧进入/退出 */
    .stage.pos-right {
      left: auto;
      right: 18px;
      transform: translateX(60%) scale(0.98);
      animation-name: fadeInLeft;
    }
    /* 内层卡片：负责外观，并通过 CSS zoom 做整体等比缩放（小/中/大） */
    .card {
      min-width: 320px;
      max-width: 400px;
      min-height: 80px;
      background: rgba(22, 24, 29, 0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 22px;
      color: #f1f3f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.08);
    }
    .preview {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      background: #222;
      object-fit: cover;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
      border: 2px solid #444;
    }
    .video-icon {
      display: none;
      width: 64px;
      height: 64px;
      border-radius: 12px;
      background: #8b1e2d;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
      border: 2px solid #b93a4a;
    }
    .stage.video .preview { display: none; }
    .stage.video .video-icon { display: flex; }
    .stage.text .preview,
    .stage.text .video-icon { display: none; }
    .info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
    }
    .title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 2px;
    }
    .desc {
      font-size: 14px;
      color: #bbb;
    }
    @keyframes fadeInRight {
      to {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }
    @keyframes fadeInLeft {
      to {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }
    @keyframes fadeOutRight {
      to {
        opacity: 0;
        transform: translateX(-60%) scale(0.98);
      }
    }
    @keyframes fadeOutLeft {
      to {
        opacity: 0;
        transform: translateX(60%) scale(0.98);
      }
    }
    .stage.fade-out {
      animation: fadeOutRight 0.3s forwards;
    }
    .stage.pos-right.fade-out {
      animation-name: fadeOutLeft;
    }
  </style>
</head>
<body>
  <div class="stage" id="notification">
    <div class="card" id="zoomer">
      <img class="preview" id="preview" src="" alt="截图预览" style="display: none;">
      <div class="video-icon" id="video-icon" aria-label="录像">🎥</div>
      <div class="info">
        <div class="title" id="title">截图成功</div>
        <div class="desc" id="desc">已保存到本地</div>
      </div>
    </div>
  </div>
  <script>
    // 支持直接通过 query 传参
    const params = new URLSearchParams(location.search);
    const imgEl = document.getElementById('preview');
    if (params.has('img') && params.get('img')) {
      imgEl.src = params.get('img');
      imgEl.style.display = 'block';
      imgEl.onerror = () => { imgEl.style.display = 'none'; };
    } else {
      imgEl.style.display = 'none';
    }
    if (params.has('title')) {
      document.getElementById('title').textContent = params.get('title');
    }
    if (params.has('desc')) {
      document.getElementById('desc').textContent = params.get('desc');
    }
    // 通知大小：整体等比缩放（小/中/大），无效或未传时按 1 处理
    const scaleParam = parseFloat(params.get('scale'));
    if (isFinite(scaleParam) && scaleParam > 0) {
      document.getElementById('zoomer').style.zoom = scaleParam;
    }
    if (params.get('type') === 'video' || params.get('type') === 'text') {
      document.getElementById('notification').classList.add(params.get('type'));
    }
    // 通知位置：right 时从右上角进入，left（默认）从左上角进入
    if (params.get('pos') === 'right') {
      document.getElementById('notification').classList.add('pos-right');
    }
    // 5秒后淡出
    setTimeout(() => {
      document.getElementById('notification').classList.add('fade-out');
      setTimeout(() => window.close(), 300);
    }, 5000);
  </script>


</body></html>
