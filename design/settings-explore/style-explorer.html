.cap{display:flex;align-items:center;gap:12px;padding-top:14px}.cap .no{font-family:var(--mono);font-size:13px;color:var(--faint);transition:color .2s}.cap .name{font-size:16px;font-weight:600;line-height:1.4;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cap .strip-mini{margin:0 auto 0 4px;width:40px;flex:none}.cap .no.base{flex:none;white-space:nowrap;font-family:inherit;font-size:12px;font-weight:600;line-height:1.6;padding:0 8px;border-radius:99px;background:var(--well);color:var(--soft)}

.stage.offline .static{display:none}
.slide .static{display:none}.static{position:absolute;left:10px;bottom:10px;z-index:2;font-size:12.5px;line-height:1.4;padding:3px 8px;border-radius:4px;background:#000c;color:#ddd;pointer-events:none}

@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes vt-out{to{opacity:0;transform:scale(.97)}}

/* 并排与单张之间、视口变化用页面过渡：同一方向的画面从卡片放大到单张，其他卡片淡出，侧栏从右侧滑入 */

::view-transition-old(*),::view-transition-new(*){height:100%;object-fit:cover;object-position:50% 0}
::view-transition-old(root),::view-transition-new(root){animation-duration:.2s}
::view-transition-old(*):only-child{animation:vt-out .18s var(--exit) both}
::view-transition-new(*):only-child{animation:vt-in .3s .08s ease-out both}
::view-transition-new(info):only-child{animation:info-in var(--glide-d) var(--glide) both}
::view-transition-old(info):only-child{animation:info-out .22s var(--exit) both}
::view-transition-old(bar){display:none}::view-transition-new(bar){animation:none}
/* 视口和缩放只改变形状与位置：外框直接变形，内容不做叠影 */
html[data-vt=reshape]::view-transition-old(*){animation:none;opacity:0}
html[data-vt=reshape]::view-transition-new(*){animation:none}
html[data-vt=reshape]::view-transition-old(*):only-child{animation:vt-out .18s var(--exit) both;opacity:1}
html[data-vt=reshape]::view-transition-new(*):only-child{animation:vt-in .3s .08s ease-out both}

]??null,getItem:k=>m.has(String(k))?m.get(String(k)):null,setItem:(k,v)=>{m.set(String(k),String(v))},removeItem:k=>{m.delete(String(k))},clear:()=>m.clear()}};for(const n of['localStorage','sessionStorage']){try{window[n].length}catch{Object.defineProperty(window,n,{value:mem(),configurable:true})}}})();\u003c/script>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Shiin 设置 · Rhythm Console\u003c/title>\n\u003cstyle>\n  :root {\n    --bg: #0b0e0b;\n    --surface: #111611;\n    --surface-low: #151b14;\n    --surface-high: #1d251c;\n    --surface-highest: #273126;\n    --text: #eef5e8;\n    --muted: #a6b3a0;\n    --muted-strong: #c6d1c0;\n    --outline: #3a4536;\n    --outline-soft: rgba(238, 245, 232, 0.09);\n    --primary: #c9f56d;\n    --on-primary: #1c2a05;\n    --primary-container: #33481c;\n    --on-primary-container: #e5ffb2;\n    --secondary-container: #283225;\n    --on-secondary-container: #dde8d6;\n    --tertiary-container: #203b36;\n    --on-tertiary-container: #a9f0df;\n    --danger: #ffb4ab;\n    --danger-container: #4b211e;\n    --on-danger-container: #ffdad6;\n    --text-radius: 999px;\n    --spring-fast: cubic-bezier(.42, 1.67, .21, .9);\n    --spring-default: cubic-bezier(.38, 1.21, .22, 1);\n    --effects: cubic-bezier(.34, .8, .34, 1);\n    --sans: \"Google Sans\", \"Avenir Next\", \"PingFang SC\", \"Hiragino Sans GB\", system-ui, sans-serif;\n  }\n  * { box-sizing: border-box; }\n  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); }\n  body { overflow: hidden; }\n  button { font: inherit; color: inherit; }\n  .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }\n  .icon { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }\n  .icon-sm { width: 15px; height: 15px; }\n  .shell { height: 100%; display: flex; flex-direction: column; }\n\n  /* ---------- global chrome ---------- */\n  .topbar {\n    height: 52px; flex: none; display: flex; align-items: center; gap: 18px;\n    padding: 0 22px; background: var(--bg); border-bottom: 1px solid var(--outline-soft);\n  }\n  .brand { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; letter-spacing: -.2px; }\n  .brand-shape { position: relative; width: 30px; height: 30px; display: grid; place-items: center; color: var(--on-primary); }\n  .brand-shape svg.mask { position: absolute; inset: 0; width: 100%; height: 100%; fill: var(--primary); }\n  .brand-shape .icon { position: relative; }\n  .topbar .crumb { color: var(--muted); font-size: 13px; }\n  .topbar .top-status {\n    margin-left: auto; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px;\n    border-radius: 999px; background: var(--surface-low); color: var(--muted-strong); font-size: 12.5px;\n  }\n  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 4px rgba(201, 245, 109, .12); }\n  .window-actions { display: flex; gap: 4px; }\n  .win-btn { width: 30px; height: 30px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; }\n  .win-btn:hover { background: var(--surface-high); color: var(--text); }\n\n  /* ---------- workspace ---------- */\n  .workspace { flex: 1; display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: 0; }\n  .settings-nav {\n    display: flex; flex-direction: column; gap: 18px; min-height: 0; padding: 26px 18px 18px;\n    background: var(--surface-low); border-right: 1px solid var(--outline-soft);\n  }\n  .nav-head { padding: 0 10px; }\n  .eyebrow, .kicker {\n    margin: 0 0 8px; font-size: 11px; font-weight: 700; letter-spacing: .16em; color: var(--muted);\n  }\n  .nav-head h1 { margin: 0; font-size: 34px; line-height: 1.1; font-weight: 600; letter-spacing: -1.2px; }\n  .search {\n    height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 16px;\n    border-radius: 999px; background: var(--surface-high); color: var(--muted);\n  }\n  .search input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: var(--text); font: inherit; font-size: 13.5px; }\n  .search input::placeholder { color: var(--muted); }\n  .nav-list { display: flex; flex-direction: column; gap: 4px; min-height: 0; overflow-y: auto; }\n  .nav-item {\n    display: flex; align-items: center; gap: 12px; width: 100%; min-height: 62px; padding: 10px 12px;\n    border: 0; border-radius: 20px; background: transparent; text-align: left; cursor: pointer;\n    transition: background-color 180ms var(--effects), border-radius 320ms var(--spring-default);\n  }\n  .nav-item:hover { background: var(--secondary-container); }\n  .nav-item[aria-current=\"page\"] { background: var(--primary-container); color: var(--on-primary-container); border-radius: 28px; }\n  .nav-icon { width: 38px; height: 38px; flex: none; display: grid; place-items: center; border-radius: 14px; background: var(--surface-high); color: var(--muted-strong); transition: border-radius 320ms var(--spring-default), background-color 180ms var(--effects); }\n  .nav-item[aria-current=\"page\"] .nav-icon { background: var(--primary); color: var(--on-primary); border-radius: 50%; }\n  .nav-copy { min-width: 0; flex: 1; display: grid; gap: 2px; }\n  .nav-copy strong { font-size: 13.5px; font-weight: 600; }\n  .nav-copy small { font-size: 11.5px; line-height: 1.35; color: var(--muted); }\n  .nav-item[aria-current=\"page\"] .nav-copy small { color: color-mix(in srgb, var(--on-primary-container) 72%, transparent); }\n  .nav-marker { font-size: 11px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }\n  .nav-item[aria-current=\"page\"] .nav-marker { color: var(--on-primary-container); }\n  .nav-foot { margin-top: auto; display: grid; gap: 10px; }\n  .session-mini {\n    display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 22px;\n    background: var(--surface-high); border: 1px solid var(--outline-soft);\n  }\n  .mini-shape { position: relative; width: 40px; height: 40px; display: grid; place-items: center; color: var(--on-primary); flex: none; }\n  .mini-shape svg.mask { position: absolute; inset: 0; width: 100%; height: 100%; fill: var(--primary); }\n  .mini-shape .icon { position: relative; }\n  .session-mini small { display: block; font-size: 11px; color: var(--muted); }\n  .session-mini strong { display: block; margin-top: 2px; font-size: 13px; font-weight: 600; }\n  .nav-version { display: flex; justify-content: space-between; padding: 0 8px; font-size: 11.5px; color: var(--muted); }\n\n  /* ---------- detail ---------- */\n  .detail { min-width: 0; overflow-y: auto; padding: 26px 30px 34px; }\n  .detail-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 22px; }\n  .breadcrumb { margin: 0 0 7px; font-size: 12px; color: var(--muted); }\n  .detail-head h2 { margin: 0; font-size: 42px; line-height: 1.06; font-weight: 600; letter-spacing: -1.6px; }\n  .lede { max-width: 56ch; margin: 10px 0 0; font-size: 14px; line-height: 1.6; color: var(--muted-strong); }\n  .head-actions { display: flex; align-items: center; gap: 10px; padding-top: 4px; }\n  .save-state { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); white-space: nowrap; }\n  .save-state i { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); }\n\n  .btn {\n    display: inline-flex; align-items: center; justify-content: center; gap: 8px;\n    min-height: 40px; padding: 0 18px; border: 1px solid transparent; border-radius: 999px;\n    background: var(--surface-high); color: var(--text); font-size: 13.5px; font-weight: 600;\n    cursor: pointer; white-space: nowrap;\n    transition: background-color 180ms var(--effects), color 180ms var(--effects), border-radius 320ms var(--spring-default), transform 240ms var(--spring-fast);\n  }\n  .btn:active { transform: scale(.96); border-radius: 14px; }\n  .btn-filled { background: var(--primary); color: var(--on-primary); }\n  .btn-tonal { background: var(--secondary-container); color: var(--on-secondary-container); }\n  .btn-outline { background: transparent; border-color: var(--outline); color: var(--text); }\n  .btn-ghost { background: transparent; color: var(--muted-strong); }\n  .btn-ghost:hover { background: var(--surface-high); }\n  .btn .icon { width: 17px; height: 17px; }\n\n  .detail-grid { display: grid; grid-template-columns: minmax(0, 1fr) 316px; gap: 20px; align-items: start; }\n  .main-stack { min-width: 0; display: grid; gap: 18px; }\n  .side-stack { min-width: 0; display: grid; gap: 18px; }\n  .card { min-width: 0; padding: 20px; border-radius: 32px; background: var(--surface); border: 1px solid var(--outline-soft); }\n  .section-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 16px; }\n  .section-head h3 { margin: 0; font-size: 20px; line-height: 1.2; font-weight: 600; letter-spacing: -.4px; }\n  .section-head .sub { margin: 5px 0 0; font-size: 12.5px; line-height: 1.45; color: var(--muted); }\n  .count-chip { flex: none; padding: 5px 10px; border-radius: 999px; background: var(--surface-high); color: var(--muted-strong); font-size: 11.5px; font-weight: 600; }\n  .count-chip.warn { background: var(--danger-container); color: var(--on-danger-container); }\n\n  .lab { padding: 0; overflow: hidden; background: var(--surface-low); }\n  .lab .section-head { padding: 20px 22px 0; margin-bottom: 0; }\n  .stage {\n    display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: center;\n    min-height: 246px; padding: 20px 22px 22px;\n  }\n  .stage-copy { min-width: 0; }\n  .stage-copy .label { margin: 0 0 4px; font-size: 12px; color: var(--mute sion-actions .next { border: 1px solid var(--outline); background: transparent; color: var(--text); }\n\n  .permission-tile { grid-column: span 5; padding: 22px; }\n  .permission-grid { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: end; margin-top: 14px; }\n  .permission-big { font-size: 54px; line-height: .9; font-weight: 500; letter-spacing: -2.4px; color: var(--primary); }\n  .permission-big small { font-size: 17px; letter-spacing: -.2px; color: var(--muted); font-weight: 500; }\n  .wavy { grid-column: 1 / -1; height: 24px; }\n  .wavy svg { width: 100%; height: 24px; overflow: visible; }\n  .permission-list { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 0; padding: 0; list-style: none; }\n  .permission-list li { display: flex; align-items: center; gap: 8px; padding: 9px 11px; border-radius: 14px; background: var(--surface-low); font-size: 12px; }\n  .permission-list .dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--tertiary); }\n  .permission-list .dot.bad { background: var(--error); }\n  .permission-list .state { margin-left: auto; font-size: 10.5px; color: var(--muted); }\n  .permission-list .state.bad { color: var(--error); font-weight: 700; }\n  .permission-action { grid-column: 1 / -1; display: flex; justify-content: flex-end; }\n\n  .startup-tile { grid-column: span 4; padding: 22px; }\n  .startup-list { display: grid; gap: 2px; margin-top: 12px; }\n  .startup-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; }\n  .startup-copy strong { display: block; font-size: 13px; font-weight: 600; }\n  .startup-copy small { display: block; margin-top: 2px; font-size: 11.5px; line-height: 1.35; color: var(--muted); }\n  .switch { position: relative; width: 56px; height: 34px; flex: none; border: 2px solid var(--outline); border-radius: 999px; background: var(--surface-high); padding: 0; }\n  .switch-thumb { position: absolute; top: 4px; left: 4px; width: 22px; height: 22px; border-radius: 50%; background: var(--muted); display: grid; place-items: center; color: transparent; transition: transform 320ms var(--spring-default), background-color 180ms var(--effects), color 180ms var(--effects), border-radius 240ms var(--spring-fast); }\n  .switch-thumb .icon { width: 13px; height: 13px; }\n  .switch[aria-checked=\"true\"] { background: var(--tertiary); border-color: var(--tertiary); }\n  .switch[aria-checked=\"true\"] .switch-thumb { transform: translateX(22px); background: white; color: var(--tertiary); }\n  .switch:active .switch-thumb { border-radius: 9px; }\n\n  .notify-tile { grid-column: span 3; padding: 22px; background: var(--tertiary-container); border-color: transparent; }\n  .notify-tile .tile-head h2 { color: var(--on-tertiary-container); }\n  .notify-tile .tile-head p { color: color-mix(in srgb, var(--on-tertiary-container) 70%, transparent); }\n  .sound-row { margin-top: 16px; }\n  .sound-label { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }\n  .sound-label strong { font-size: 13px; font-weight: 700; color: var(--on-tertiary-container); }\n  .sound-label output { font-size: 24px; font-weight: 500; letter-spacing: -.8px; color: var(--on-tertiary-container); font-variant-numeric: tabular-nums; }\n  .slider { --progress: 68%; margin-top: 8px; width: 100%; height: 36px; appearance: none; background: transparent; cursor: ew-resize; }\n  .slider::-webkit-slider-runnable-track { height: 12px; border-radius: 999px; background: linear-gradient(to right, var(--tertiary) 0 var(--progress), rgba(255,255,255,.55) var(--progress) 100%); }\n  .slider::-webkit-slider-thumb { appearance: none; width: 6px; height: 30px; margin-top: -9px; border-radius: 4px; background: var(--tertiary); box-shadow: 0 0 0 5px var(--tertiary-container); }\n  .notify-actions { display: flex; gap: 6px; margin-top: 16px; }\n  .notify-actions button { flex: 1; min-height: 38px; border: 1px solid rgba(0,32,31,.22); border-radius: 999px; background: transparent; color: var(--on-tertiary-container); font-size: 12px; font-weight: 700; }\n  .notify-actions button:hover { background: rgba(255,255,255,.28); }\n\n  .data-tile { grid-column: span 12; padding: 16px 22px; display: flex; align-items: center; gap: 16px; }\n  .data-tile .version { font-size: 26px; font-weight: 500; letter-spacing: -1px; }\n  .data-tile .meta { font-size: 12px; color: var(--muted); }\n  .data-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }\n  .secondary-button {\n    min-height: 40px; padding: 0 16px; border: 1px solid var(--outline); border-radius: 999px;\n    background: transparent; color: var(--text); font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px;\n    transition: background-color 180ms var(--effects), border-radius 320ms var(--spring-default), transform 240ms var(--spring-fast);\n  }\n  .secondary-button:hover { background: var(--surface-high); }\n  .secondary-button:active { border-radius: 14px; transform: scale(.96); }\n\n  .sub-actions { display: flex; gap: 6px; margin-top: 12px; }\n  .sub-actions .text-button {\n    min-height: 38px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent;\n    color: var(--primary); font-size: 12.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px;\n  }\n  .sub-actions .text-button:hover { background: var(--primary-container); color: var(--on-primary-container); }\n\n  ::-webkit-scrollbar { width: 8px; height: 8px; }\n  ::-webkit-scrollbar-thumb { background: var(--surface-highest); border-radius: 999px; }\n  ::-webkit-scrollbar-track { background: transparent; }\n  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003csvg class=\"sprite\" aria-hidden=\"true\">\n  \u003cdefs>\n    \u003csymbol id=\"i-gamepad\" viewBox=\"0 0 24 24\">\u003cpath d=\"M8 8h8a4 4 0 0 1 4 4v3a3 3 0 0 1-5.2 2L13 15h-2l-1.8 2A3 3 0 0 1 4 15v-3a4 4 0 0 1 4-4Z\"/>\u003cpath d=\"M7 11h2M8 10v2M16 11h.01M18 13h.01\"/>\u003c/symbol>\n    \u003csymbol id=\"i-sliders\" viewBox=\"0 0 24 24\">\u003cpath d=\"M4 8h10M18 8h2M4 16h4M12 16h8M16 5v6M8 13v6\"/>\u003c/symbol>\n    \u003csymbol id=\"i-shield\" viewBox=\"0 0 24 24\">\u003cpath d=\"M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6Z\"/>\u003cpath d=\"m8.5 12 2.3 2.3 4.7-5\"/>\u003c/symbol>\n    \u003csymbol id=\"i-power\" viewBox=\"0 0 24 24\">\u003cpath d=\"M12 4v8\"/>\u003cpath d=\"M7.5 6.5a7 7 0 1 0 9 0\"/>\u003c/symbol>\n    \u003csymbol id=\"i-bell\" viewBox=\"0 0 24 24\">\u003cpath d=\"M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8\"/>\u003cpath d=\"M13.7 21a2 2 0 0 1-3.4 0\"/>\u003c/symbol>\n    \u003csymbol id=\"i-database\" viewBox=\"0 0 24 24\">\u003cellipse cx=\"12\" cy=\"5\" rx=\"8\" ry=\"3\"/>\u003cpath d=\"M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0\"/>\u003c/symbol>\n    \u003csymbol id=\"i-check\" viewBox=\"0 0 24 24\">\u003cpath d=\"m5 12 4 4L19 6\"/>\u003c/symbol>\n    \u003csymbol id=\"i-refresh\" viewBox=\"0 0 24 24\">\u003cpath d=\"M4 4v6h6\"/>\u003cpath d=\"M20 20v-6h-6\"/>\u003cpath d=\"M4 10a8 8 0 0 1 14-4\"/>\u003cpath d=\"M20 14a8 8 0 0 1-14 4\"/>\u003c/symbol>\n    \u003csymbol id=\"i-shuffle\" viewBox=\"0 0 24 24\">\u003cpath d=\"M3 6h3l12 12h3M3 18h3l4-4M14 10l4-4h3M17 2l4 4-4 4M17 14l4 4-4 4\"/>\u003c/symbol>\n    \u003csymbol id=\"i-lock\" viewBox=\"0 0 24 24\">\u003crect x=\"5\" y=\"10\" width=\"14\" height=\"11\" rx=\"3\"/>\u003cpath d=\"M8 10V6a4 4 0 0 1 8 0v4M12 14v3\"/>\u003c/symbol>\n    \u003csymbol id=\"i-camera\" viewBox=\"0 0 24 24\">\u003cpath d=\"M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z\"/>\u003ccircle cx=\"12\" cy=\"13\" r=\"3.5\"/>\u003c/symbol>\n    \u003csymbol id=\"i-folder\" viewBox=\"0 0 24 24\">\u003cpath d=\"M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z\"/>\u003c/symbol>\n    \u003csymbol id=\"i-volume\" viewBox=\"0 0 24 24\">\u003cpath d=\"M11 5 6 9H3v6h3l5 4Z\"/>\u003cpath d=\"M16 9a4 4 0 0 1 0 6\"/>\u003cpath d=\"M19 6a8 8 0 0 1 0 12\"/>\u003c/symbol>\n    \u003csymbol id=\"i-play\" viewBox=\"0 0 24 24\">\u003cpath d=\"m7 4 13 8-13 8Z\"/>\u003c/symbol>\n  \u003c/defs>\n\u003c/svg>\n\n\u003cdiv class=\"shell\">\n  \u003cheader class=\"topbar\">\n    \u003cdiv class=\"brand\">\u003cspan class=\"brand-mark\">\u003csvg class=\"icon icon-sm\">\u003cuse href=\"#i-gamepad\"/>\u003c/svg>\u003c/span>Shiin\u003c/div>\n    \u003cspan class=\"save\">\u003ci>\u003c/i>本机设置 · 自动保存\u003c/span>\n    \u003cbutton class=\"icon-button\" aria-label=\"检查更新\">\u003csvg class=\"icon\">\u003cuse href=\"#i-refresh\"/>\u003c/svg>\u003c/button>\n  \u003c/header>\n\n  \u003cmain class=\"page\">\n    \u003cdiv class=\"page-inner\">\n      \u003cdiv class=\"masthead\">\n        \u003cdiv>\n          \u003cp class=\"eyebrow\">PREFERENCES\u003c/p>\n          \u003ch1>设置\u003c/h1>\n          \u003cp>形状、权限和启动行为都在这一页完成。改动即时生效，并只保存在这台设备。\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"masthead-actions\">\n          \u003cbutton class=\"primary-button\">\u003csvg class=\"icon icon-sm\">\u003cuse href=\"#i-check\"/>\u003c/svg>全部完成\u003c/button>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cnav class=\"category-strip\" aria-label=\"设置分区\">\n        \u003cbutton aria-pressed=\"true\">\u003csvg class=\"icon icon-sm\">\u003cuse href=\"#i-sliders\"/>\u003c/svg>形状与控件\u003c/button>\n        \u003cbutton aria-pressed=\"false\">\u003csvg class=\"icon icon-sm\">\u003cuse href=\"#i-shield\"/>\u003c/svg>权限\u003c/button>\n        \u003cbutton aria-pressed=\"false\">\u003csvg class=\"icon icon-sm\">\u003cuse href=\"#i-power\"/>\u003c/svg>启动与托盘\u003c/button>\n        \u003cbutton aria-pressed=\"false\">\u003csvg class=\"icon icon-sm\">\u003cuse href=\"#i-bell\"/>\u003c/svg>通知\u003c/button>\n        \u003cbutton aria-pressed=\"false\">\u003csvg class=\"icon icon-sm\">\u003cuse href=\"#i-database\"/>\u003c/svg>数据\u003c/button>\n      \u003c/nav>\n\n      \u003cdiv class=\"bento\">\n        \u003csection class=\"tile shape-tile\" aria-label=\"形状实验室\">\n          \u003cdiv class=\"tile-head\">\n            \u003cdiv>\u003ch2>形状实验室\u003c/h2>\u003cp>同一轮廓会应用到所有图标按钮与徽章。\u003c/p>\u003c/div>\n            \u003cspan class=\"chip tertiary\">仅此应用\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"shape-lab\">\n            \u003cdiv class=\"shape-stage\">\n              \u003cdiv class=\"hero-shape\">\u003csvg class=\"mask\" viewBox=\"0 0 100 100\" aria-hidden=\"true\">\u003cpath data-live-shape d=\"\">\u003c/path>\u003c/svg>\u003csvg class=\"icon\">\u003cuse href=\"#i-gamepad\"/>\u003c/svg>\u003c/div>\n              \u003cspan class=\"stage-label\" id=\"heroShapeLabel\">ARCH · 拱门\u003c/span>\n            \u003c/div>\n            \u003cdiv class=\"shape-controls\">\n              \u003cdiv class=\"strategy\">\n                \u003cdiv class=\"strategy-copy\">\u003cstrong>图标按钮策略\u003c/strong>\u003cspan id=\"strategyNote\">启动时抽取一次，使用中保持稳定。\u003c/span>\u003c/div>\n                \u003cdiv class=\"connected\" role=\"group\" aria-label=\"形状策略\">\n                  \u003cbutton type=\"button\" data-mode=\"random\" aria-pressed=\"true\">\u003csvg class=\"icon\">\u003cuse href=\"#i-check\"/>\u003c/svg>启动随机\u003c/button>\n                  \u003cbutton type=\"button\" data-mode=\"fixed\" aria-pressed=\"false\">\u003csvg class=\"icon\">\u003cuse href=\"#i-check\"/>\u003c/svg>固定组合\u003c/button>\n                \u003c/div>\n              \u003c/div>\n              \u003cdiv>\n                \u003cdiv class=\"ribbon-label\">图标形状\u003c/div>\n                \u003cdiv class=\"shape-ribbon\" id=\"shapeRibbon\">\u003c/div>\n              \u003c/div>\n              \u003cdiv class=\"text-shape-row\">\n                \u003cspan class=\"text-label\">文字按钮\u003c/span>\n                \u003cdiv class=\"text-options\">\n                  \u003cbutton type=\"button\" class=\"text-option\" data-text=\"round\">圆角\u003c/button>\n                  \u003cbutton type=\"button\" class=\"text-option\" data-text=\"soft\">柔和\u003c/button>\n                  \u003cbutton type=\"button\" class=\"text-option\" data-text=\"pill\" aria-pressed=\"true\">胶囊\u003c/button>\n                \u003c/div>\n              \u003c/div>\n            \u003c/div>\n          \u003c/div>\n        \u003c/section>\n\n        \u003csection class=\"tile session-tile\" aria-label=\"本次启动\">\n          \u003cdiv class=\"session-top\">\n            \u003cspan class=\"session-number\">01\u003c/span>\n            \u003cdiv class=\"session-copy\">\u003ch2 id=\"sessionHeading\">启动随机\u003c/h2>\u003cp id=\"sessionSub\">每次启动换一组形态，同类控件一致。\u003c/p>\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"session-combo\">\n            \u003cspan class=\"session-shape\">\u003csvg class=\"mask\" viewBox=\"0 0 100 100\" aria-hidden=\"true\">\u003cpath data-live-shape d=\"\">\u003c/path>\u003c/svg>\u003csvg class=\"icon\">\u003cuse href=\"#i-gamepad\"/>\u003c/svg>\u003c/span>\n            \u003cdiv>\u003cstrong id=\"comboName\">拱门 · 胶囊\u003c/strong>\u003csmall id=\"comboNote\">本次会话 · 使用中不重抽\u003c/small>\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"session-actions\">\n            \u003cbutton type=\"button\" class=\"lock\" id=\"lockCombo\">固定当前组合\u003c/button>\n            \u003cbutton type=\"button\" class=\"next\" id=\"nextLaunch\">模拟下次启动\u003c/button>\n          \u003c/div>\n        \u003c/section>\n\n        \u003csection class=\"tile permission-tile\" aria-label=\"权限状态\">\n          \u003cdiv class=\"tile-head\">\u003cdiv>\u003ch2>权限与环境\u003c/h2>\u003cp>截图、窗口识别与目录读写。\u003c/p>\u003c/div>\u003cspan class=\"chip warn\">1 项待处理\u003c/span>\u003c/div>\n          \u003cdiv class=\"permission-grid\">\n            \u003cdiv class=\"permission-big\">3\u003csmall> / 4 已授予\u003c/small>\u003c/div>\n            \u splay: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }\n  .text-options { display: flex; gap: 4px; }\n  .text-option {\n    min-height: 36px; padding: 0 14px; border: 1px solid var(--line); background: transparent;\n    color: var(--muted-strong); font-size: 11.5px; font-weight: 600;\n    transition: background-color 180ms var(--effects), color 180ms var(--effects), border-color 180ms var(--effects), border-radius 320ms var(--spring-default);\n  }\n  .text-option[data-text=\"round\"] { border-radius: 12px; }\n  .text-option[data-text=\"soft\"] { border-radius: 26px; }\n  .text-option[data-text=\"pill\"] { border-radius: 999px; }\n  .text-option[aria-pressed=\"true\"] { background: var(--mint); border-color: var(--mint); color: var(--on-mint); }\n\n  .session-line { display: flex; align-items: center; gap: 14px; padding: 14px 0 0; border-top: 1px solid var(--line); }\n  .session-line .no { font-family: var(--serif); font-size: 28px; color: var(--primary); line-height: 1; }\n  .session-line .copy { min-width: 0; flex: 1; }\n  .session-line strong { display: block; font-size: 12.5px; font-weight: 600; }\n  .session-line small { display: block; margin-top: 2px; font-size: 11px; color: var(--muted); }\n  .session-line .actions { display: flex; gap: 6px; }\n  .session-line button {\n    min-height: 36px; padding: 0 13px; border: 1px solid var(--line-strong); border-radius: 3px 14px 3px 14px;\n    background: transparent; color: var(--text); font-size: 11.5px; font-weight: 600; white-space: nowrap;\n    transition: background-color 180ms var(--effects), color 180ms var(--effects);\n  }\n  .session-line button:hover { background: var(--surface-high); }\n  .session-line button.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }\n\n  .permission-body { display: grid; grid-template-columns: 1.15fr .85fr; gap: 40px; align-items: start; }\n  .progress-block { min-width: 0; }\n  .progress-top { display: flex; align-items: baseline; gap: 12px; }\n  .progress-top strong { font-family: var(--serif); font-size: 66px; line-height: .9; font-weight: 500; letter-spacing: -3px; color: var(--primary); }\n  .progress-top span { font-size: 13px; line-height: 1.4; color: var(--muted-strong); }\n  .wavy { margin: 16px 0 18px; height: 28px; }\n  .wavy svg { width: 100%; height: 28px; overflow: visible; }\n  .progress-note { margin: 0; font-size: 12.5px; line-height: 1.6; color: var(--muted); max-width: 48ch; }\n  .perm-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 24px; border-top: 1px solid var(--line); }\n  .perm-item { display: flex; align-items: center; gap: 9px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }\n  .perm-item .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--mint); flex: none; }\n  .perm-item .dot.bad { background: var(--error); }\n  .perm-item .state { margin-left: auto; font-family: var(--mono); font-size: 10px; letter-spacing: .08em; color: var(--muted); }\n  .perm-item .state.bad { color: var(--error); }\n  .band .action-line { display: flex; justify-content: flex-end; margin-top: 14px; }\n  .line-button {\n    min-height: 38px; padding: 0 15px; border: 1px solid var(--line-strong); border-radius: 3px 15px 3px 15px;\n    background: transparent; color: var(--text); font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px;\n  }\n  .line-button:hover { background: var(--surface-high); }\n  .line-button.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }\n\n  .inline-settings { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 40px; }\n  .setting-line { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 13px 0; border-bottom: 1px solid var(--line); }\n  .setting-copy strong { display: block; font-size: 13px; font-weight: 600; }\n  .setting-copy small { display: block; margin-top: 2px; font-size: 11.5px; line-height: 1.4; color: var(--muted); }\n  .square-switch { position: relative; width: 50px; height: 30px; flex: none; border: 1px solid var(--line-strong); border-radius: 4px; background: transparent; padding: 0; }\n  .square-switch::after { content: \"\"; position: absolute; top: 4px; left: 4px; width: 20px; height: 20px; border-radius: 2px; background: var(--muted); transition: transform 320ms var(--spring-default), background-color 180ms var(--effects); }\n  .square-switch[aria-checked=\"true\"] { border-color: var(--mint); }\n  .square-switch[aria-checked=\"true\"]::after { transform: translateX(20px); background: var(--mint); }\n  .square-switch:active::after { border-radius: 7px; }\n\n  .sound-line { display: flex; align-items: center; gap: 20px; }\n  .sound-line .name { font-family: var(--serif); font-size: 28px; font-weight: 500; letter-spacing: -.8px; white-space: nowrap; }\n  .sound-line .duration { font-family: var(--mono); font-size: 11px; color: var(--muted); }\n  .sound-slider { --progress: 68%; flex: 1; min-width: 160px; appearance: none; height: 34px; background: transparent; }\n  .sound-slider::-webkit-slider-runnable-track { height: 8px; background: linear-gradient(to right, var(--primary) 0 var(--progress), var(--surface-high) var(--progress) 100%); }\n  .sound-slider::-webkit-slider-thumb { appearance: none; width: 5px; height: 30px; margin-top: -11px; background: var(--primary); border-radius: 2px; box-shadow: 0 0 0 4px var(--bg); }\n  .sound-out { font-family: var(--mono); font-size: 12px; color: var(--primary); width: 44px; text-align: right; }\n\n  .data-line { display: flex; align-items: center; gap: 20px; }\n  .data-line .version { font-family: var(--serif); font-size: 40px; line-height: 1; font-weight: 500; letter-spacing: -1.5px; }\n  .data-line .meta { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; color: var(--muted); }\n  .data-line .actions { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }\n\n  ::-webkit-scrollbar { width: 8px; height: 8px; }\n  ::-webkit-scrollbar-thumb { background: var(--surface-high); border-radius: 999px; }\n  ::-webkit-scrollbar-track { background: transparent; }\n  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003csvg class=\"sprite\" aria-hidden=\"true\">\n  \u003cdefs>\n    \u003csymbol id=\"i-gamepad\" viewBox=\"0 0 24 24\">\u003cpath d=\"M8 8h8a4 4 0 0 1 4 4v3a3 3 0 0 1-5.2 2L13 15h-2l-1.8 2A3 3 0 0 1 4 15v-3a4 4 0 0 1 4-4Z\"/>\u003cpath d=\"M7 11h2M8 10v2M16 11h.01M18 13h.01\"/>\u003c/symbol>\n    \u003csymbol id=\"i-camera\" viewBox=\"0 0 24 24\">\u003cpath d=\"M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z\"/>\u003ccircle cx=\"12\" cy=\"13\" r=\"3.5\"/>\u003c/symbol>\n    \u003csymbol id=\"i-play\" viewBox=\"0 0 24 24\">\u003cpath d=\"m7 4 13 8-13 8Z\"/>\u003c/symbol>\n    \u003csymbol id=\"i-wave\" viewBox=\"0 0 24 24\">\u003cpath d=\"M2 12h3l2-6 3 12 3-9 2 3h7\"/>\u003c/symbol>\n    \u003csymbol id=\"i-shield\" viewBox=\"0 0 24 24\">\u003cpath d=\"M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6Z\"/>\u003cpath d=\"m8.5 12 2.3 2.3 4.7-5\"/>\u003c/symbol>\n    \u003csymbol id=\"i-refresh\" viewBox=\"0 0 24 24\">\u003cpath d=\"M4 4v6h6\"/>\u003cpath d=\"M20 20v-6h-6\"/>\u003cpath d=\"M4 10a8 8 0 0 1 14-4\"/>\u003cpath d=\"M20 14a8 8 0 0 1-14 4\"/>\u003c/symbol>\n    \u003csymbol id=\"i-database\" viewBox=\"0 0 24 24\">\u003cellipse cx=\"12\" cy=\"5\" rx=\"8\" ry=\"3\"/>\u003cpath d=\"M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0\"/>\u003c/symbol>\n    \u003csymbol id=\"i-close\" viewBox=\"0 0 24 24\">\u003cpath d=\"M6 6l12 12M18 6L6 18\"/>\u003c/symbol>\n    \u003csymbol id=\"i-folder\" viewBox=\"0 0 24 24\">\u003cpath d=\"M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z\"/>\u003c/symbol>\n  \u003c/defs>\n\u003c/svg>\n\n\u003cdiv class=\"shell\">\n  \u003cheader class=\"topline\">\n    \u003cdiv class=\"brand\">\u003cspan class=\"mark\">\u003c/span>Shiin\u003c/div>\n    \u003cspan class=\"meta\">PREFERENCES / 本机设置\u003c/span>\n    \u003cdiv class=\"right\">\u003cspan>2.0.0\u003c/span>\u003cbutton class=\"close\" aria-label=\"关闭设置\">\u003csvg class=\"icon icon-sm\">\u003cuse href=\"#i-close\"/>\u003c/svg>\u003c/button>\u003c/div>\n  \u003c/header>\n\n  \u003cmain class=\"page\">\n    \u003cdiv class=\"wrap\">\n      \u003csection class=\"masthead\">\n        \u003cdiv class=\"mast-copy\">\n          \u003cp class=\"kicker\">SETTINGS / 01 — 05\u003c/p>\n          \u003ch1>设置\u003c/h1>\n          \u003cp class=\"lede\">把形状、权限和启动行为排在同一张桌面上。每个分区只保留一个主动作，改动即时生效，只写入这台设备。\u003c/p>\n          \u003cul class=\"index\">\n            \u003cli>\u003ca href=\"#band-shape\">\u003cspan class=\"num\">01\u003c/span>形状与控件\u003c/a>\u003c/li>\n            \u003cli>\u003ca href=\"#band-permission\">\u003cspan class=\"num\">02\u003c/span>权限与环境\u003c/a>\u003c/li>\n            \u003cli>\u003ca href=\"#band-startup\">\u003cspan class=\"num\">03\u003c/span>启动与托盘\u003c/a>\u003c/li>\n            \u003cli>\u003ca href=\"#band-notify\">\u003cspan class=\"num\">04\u003c/span>通知与声音\u003c/a>\u003c/li>\n            \u003cli>\u003ca href=\"#band-data\">\u003cspan class=\"num\">05\u003c/span>数据与更新\u003c/a>\u003c/li>\n          \u003c/ul>\n        \u003c/div>\n        \u003cdiv class=\"mast-art\" aria-hidden=\"true\">\n          \u003cdiv class=\"mast-shape\">\u003csvg class=\"mask\" viewBox=\"0 0 100 100\">\u003cpath data-live-shape d=\"\">\u003c/path>\u003c/svg>\u003csvg class=\"icon\">\u003cuse href=\"#i-gamepad\"/>\u003c/svg>\u003c/div>\n          \u003cdiv class=\"art-meta\">\u003cstrong id=\"artShape\">ARCH\u003c/strong>\u003cspan>MATERIAL SHAPE\u003c/span>\u003cspan>72 / 100\u003c/span>\u003c/div>\n        \u003c/div>\n      \u003c/section>\n\n      \u003csection class=\"band\" id=\"band-shape\">\n        \u003cdiv class=\"band-head\">\n          \u003cdiv class=\"band-number\">01\u003c/div>\n          \u003cdiv class=\"band-title\">\u003ch2>形状与控件\u003c/h2>\u003cp>图标按钮在启动时抽取一组形状；文字按钮单独选择圆角。所有同类控件共享同一选择，使用中不会重抽。\u003c/p>\u003c/div>\n          \u003cspan class=\"band-tag\">LIVE / SESSION\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"band-body\">\n          \u003cdiv class=\"stage\">\n            \u003cdiv class=\"stage-top\">\u003cspan class=\"stage-kicker\">形状预览\u003c/span>\u003cspan class=\"stage-live\">\u003ci>\u003c/i>本次会话\u003c/span>\u003c/div>\n            \u003cdiv class=\"stage-center\">\u003cdiv class=\"big-shape\">\u003csvg class=\"mask\" viewBox=\"0 0 100 100\" aria-hidden=\"true\">\u003cpath data-live-shape d=\"\">\u003c/path>\u003c/svg>\u003csvg class=\"icon\">\u003cuse href=\"#i-gamepad\"/>\u003c/svg>\u003c/div>\u003c/div>\n            \u003cdiv>\n              \u003cdiv class=\"stage-caption\" id=\"stageCaption\" style=\"margin-bottom:12px\">ARCH · 拱门 / 胶囊\u003c/div>\n              \u003cdiv class=\"stage-actions\">\n                \u003cbutton class=\"shape-orb is-primary\" aria-label=\"立即截图\" title=\"立即截图\">\u003csvg class=\"mask\" viewBox=\"0 0 100 100\" aria-hidden=\"true\">\u003cpath data-live-shape d=\"\">\u003c/path>\u003c/svg>\u003csvg class=\"icon\">\u003cuse href=\"#i-camera\"/>\u003c/svg>\u003c/button>\n                \u003cbutton class=\"shape-orb\" aria-label=\"开启监听\" title=\"开启监听\">\u003csvg class=\"mask\" viewBox=\"0 0 100 100\" aria-hidden=\"true\">\u003cpath data-live-shape d=\"\">\u003c/path>\u003c/svg>\u003csvg class=\"icon\">\u003cuse href=\"#i-play\"/>\u003c/svg>\u003c/button>\n                \u003cbutton class=\"shape-orb is-mint\" aria-label=\"保存回放\" title=\"保存回放\">\u003csvg class=\"mask\" viewBox=\"0 0 100 100\" aria-hidden=\"true\">\u003cpath data-live-shape d=\"\">\u003c/path>\u003c/svg>\u003csvg class=\"icon\">\u003cuse href=\"#i-wave\"/>\u003c/svg>\u003c/button>\n                \u003cbutton class=\"preview-text filled\" id=\"previewFilled\">立即截图\u003c/button>\n                \u003cbutton class=\"preview-text outline\" id=\"previewOutline\">OBS 回放\u003c/button>\n              \u003c/div>\n            \u003c/div>\n          \u003c/div>\n\n          \u003cdiv class=\"controls\">\n            \u003cdiv class=\"control-row\">\n              \u003cdiv class=\"control-copy\">\u003cstrong>图标按钮策略\u003c/strong>\u003cp id=\"modeNote\">启动时换一组形态，同类控件一致；使用中不会重新抽取。\u003c/p>\u003c/div>\n              \u003cdiv class=\"mode-switch\" role=\"group\" aria-label=\"图标按钮策略\">\n                \u003cbutton type=\"button\" data-mode=\"random\" aria-pressed=\"true\">启动随机\u003c/button>\n                \u003cbutton type=\"button\" data-mode=\"fixed\" aria-pressed=\"false\">固定组合\u003c/button>\n              \u003c/div>\n            \u003c/div>\n            \u003cdiv>\n              \u003cdiv class=\"shape-section-label\">\u003cspan>图标形状\u003c/span>\u003cspan>8 种 / 点选即固定\u003c/span>\u003c/div>\n              \u003cdiv class=\"shape-ribbon\" id=\"shapeRibbon\">\u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"control-row\" style=\"padding-bottom:0;border-bottom:0\">\n              \u003cdiv class=\"control-copy\">\u003cstrong>文字按钮\u003c/strong>\u003cp>圆角按 12 / 26 / 全圆三档切换。\u003c/p>\u003c/div>\n              \u003cdiv class=\"text-options\" role=\"group\" aria-label=\"文字按钮形态\">\n                \u003cbutton type=\"button\" class=\"text-option\" data-text=\"round\">圆角\u003c/button>\n                \u003cbutton type=\"button\" class=\"text-option\" data-text=\"soft\">柔和\u003c/button>\n                \u003cbutton type=\"button\" class=\"text-option\" data-text=\"pill\" aria-pressed=\"true\">胶囊\u003c/button>\n              \u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"session-line\">\n              \u003cspan class=\"no\">01\u003c/span>\n              \u003cdiv class=\"copy\">\u003cstrong id=\"sessionTitle\">第 1 次启动 · 启动随机\u003c/strong>\u003csmall id=\"sessionNote\">   if(box.classList.contains('slide')){const cs=getComputedStyle(box),w=box.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),h=narrow()?(native?innerHeight-$('#bar').offsetHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom):Infinity):box.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);r=box.dataset.zoom==='actual'?1:Math.min(w/size.w,h/size.h,1);}
  else r=Math.min(box.clientWidth/size.w,1);
  if(!(r>0))return;
  s.style.width=`${size.w*r}px`;s.style.height=`${size.h*r}px`;m.style.width=`${size.w}px`;m.style.height=`${size.h}px`;m.style.transform=`scale(${r})`;
 }
 const fitAll=()=>$$('.stage').forEach(fit),refit=()=>requestAnimationFrame(fitAll);

 function specList(c){
  const dl=el('dl','spec');const row=(k,v)=>{dl.append(el('dt',null,k),el('dd',null,v));};
  row(t('fonts'),c.typography);row(t('traits'),(c.traits||[]).join(' · '));return dl;
 }
 function pickButton(c){const b=el('button','pick');b.type='button';b.dataset.pick=c.id;b.addEventListener('click',()=>choose(c.id));return b;}
 function card(c,i){
  const a=el('article','card');a.dataset.id=c.id;a.style.setProperty('--i',i);a.setAttribute('aria-label',c.name);
  const frame=el('div','frame');frame.style.viewTransitionName=vtName(c);const s=stage(c,false);
  const hit=el('button','hit');hit.type='button';hit.setAttribute('aria-label',t('viewDirection',{name:c.name}));hit.addEventListener('click',()=>setLayout('loupe',c.id));
  s.append(hit);frame.append(s,el('span','pick-mark',t('selected')),el('span','peek',t('peek')));
  const cap=el('div','cap');cap.style.viewTransitionName=`cap-${C.indexOf(c)}`;cap.append(el('span',c.baseline?'no base':'no',no(c)),el('h2','name',c.name),stripMini(c),pickButton(c));
  const lede=el('p','lede',c.concept);lede.title=c.concept;lede.style.viewTransitionName=`lede-${C.indexOf(c)}`;
  a.append(frame,cap,lede);return a;
 }
 function syncCompare(){
  const list=shown(),g=$('#grid'),key=list.map(c=>c.id).join();
  if(key!==gridKey){gridKey=key;g.replaceChildren(...list.map(card));}
  g.style.setProperty('--cols',Math.min(Math.max(list.length,1),st.viewport==='mobile'?4:3));
  $$('.card .frame').forEach(f=>f.dataset.viewport=byId[f.parentElement.dataset.id].nativeViewport?'native':st.viewport);
 }

 // 单张查看：所有方向预先排成一条横向轨道，切换时整条轨道滑动，不重新加载画面
 function syncLoupe(dir){
  const list=shown(),key=list.map(c=>c.id).join();if(!list.length)return;
  if(key!==loupeKey){
   loupeKey=key;dir=0;
   $('#track').replaceChildren(...list.map(c=>{const sl=el('div','slide');sl.dataset.id=c.id;sl.append(stage(c,true));return sl;}));
   $('#film').replaceChildren(el('span','film-ind'),...list.map(c=>{const b=el('button');b.type='button';b.dataset.id=c.id;b.append(el('span','fn',no(c)),el('span','ft',c.name),stripMini(c));b.addEventListener('click',()=>go(c.id));return b;}));
  }
  if(!list.some(c=>c.id===st.current))st.current=list[0].id;
  const i=list.findIndex(c=>c.id===st.current),track=$('#track');
  if(!dir)track.style.transition='none';
  track.style.transform=`translateX(${-i*100}%)`;
  if(!dir){track.offsetWidth;track.style.transition='';}
  $$('.slide').forEach(sl=>{const on=sl.dataset.id===st.current;sl.classList.toggle('is-current',on);sl.inert=!on;sl.dataset.zoom=on&&zoomActual?'actual':'fit';sl.firstElementChild.style.viewTransitionName=on?vtName(byId[sl.dataset.id]):'none';});
  $('#prev').disabled=i<=0;$('#next').disabled=i>=list.length-1;
  $$('#film button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.id===st.current)));
  renderInfo(dir);placeFilm(!dir);
  const cur=$('#film [aria-current=true]'),f=$('#film');
  if(cur&&f.scrollWidth>f.clientWidth)f.scrollTo({left:cur.offsetLeft-16,behavior:calm.matches||!dir?'auto':'smooth'});
 }
 function renderInfo(dir){
  const c=byId[st.current],body=$('#info-body');
  const sw=el('div','big-sw');(c.palette||[]).forEach(h=>{const d=el('div');const x=el('i');x.style.background=h;d.append(x,h.toUpperCase());sw.append(d);});
  const tools=el('div','tools');const z=el('button','tool',zoomActual?t('fit'):t('actual'));z.id='zoom';z.type='button';z.setAttribute('aria-pressed',String(zoomActual));z.addEventListener('click',toggleZoom);tools.append(z);
  const hint=el('p','hint');hint.innerHTML=t('keyboardHint');
  const blocks=[el('span','idx',no(c)),el('h2','name',c.name)];
  blocks.push(el('p','north',c.concept),sw,specList(c));
  blocks.push(pickButton(c),tools,hint);
  body.replaceChildren(...blocks);paintChoice();
  if(dir)animate(body,[{opacity:0,transform:`translateX(${dir*18}px)`},{opacity:1,transform:'none'}],{duration:420,easing:ease('glide')});
 }
 function toggleZoom(){
  morph(()=>{zoomActual=!zoomActual;const sl=$('.slide.is-current');sl.dataset.zoom=zoomActual?'actual':'fit';fitAll();sl.scrollTo(0,0);const z=$('#zoom');z.textContent=zoomActual?t('fit'):t('actual');z.setAttribute('aria-pressed',String(zoomActual));},'reshape');
 }

 function render(){
  const list=shown(),loupe=st.layout==='loupe'&&list.length>0;
  $('#compare-view').hidden=st.layout!=='compare'||!list.length;$('#loupe').hidden=!loupe;
  syncCompare();syncLoupe(0);
  $$('[data-layout]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.layout===st.layout)));
  $$('[data-viewport]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.viewport===st.viewport)));
  placeThumbs(false);placeFilm(true);
  paintChoice();fitAll();
 }
 function setLayout(layout,id){
  if(layout===st.layout&&!(id&&id!==st.current))return;
  if(layout==='loupe'&&st.layout==='compare')compareScroll=scrollY;
  if(id)st.current=id;st.layout=layout;zoomActual=false;save();
  morph(()=>{
   render();
   if(layout==='loupe'){window.scrollTo(0,0);return;}
   window.scrollTo(0,compareScroll);
   const a=$(`.card[data-id="${CSS.escape(st.current)}"]`),r=a?.getBoundingClientRect();
   if(r&&(r.top<60||r.bottom>innerHeight))a.scrollIntoView({block:'center'});
  });
 }
 function go(id){
  const list=shown(),from=list.findIndex(c=>c.id===st.current),to=list.findIndex(c=>c.id===id);
  if(to<0||to===from)return;
  st.current=id;zoomActual=false;save();syncLoupe(Math.sign(to-from));fitAll();
 }
 function step(d){const list=shown(),i=list.findIndex(c=>c.id===st.current),n=list[i+d];if(n)go(n.id);else nudge(d);}
 function nudge(d){animate($('.slide.is-current .stage'),[{transform:'none'},{transform:`translateX(${d*14}px)`},{transform:'none'}],{duration:320,easing:'ease-out'});}

 // 选择即复制：再次点击“已选择”重新复制这个方向
 function choose(id){
  const fresh=st.chosen!==id;st.chosen=id;save();paintChoice();
  if(fresh){
   animate($(`.card[data-id="${CSS.escape(id)}"] .pick-mark`),[{opacity:0,transform:'scale(.4)'},{opacity:1,transform:'scale(1)'}],{duration:500,easing:ease('pop')});
  }
  copy();
 }
 function paintChoice(){
  $$('.card').forEach(a=>a.classList.toggle('is-chosen',a.dataset.id===st.chosen));
  $$('[data-pick]').forEach(b=>{const on=b.dataset.pick===st.chosen,short=!!b.closest('.cap');b.replaceChildren(document.createTextNode(on?(short?t('selected'):t('selectedCopy')):(short?t('select'):t('selectDirection'))));if(!short)b.append(el('kbd',null,'P'));b.toggleAttribute('data-on',on);b.title=on?t('recopyTitle'):t('selectTitle');});
  $$('#film button').forEach(b=>b.querySelector('.ft').classList.toggle('chosen',b.dataset.id===st.chosen));
 }
 function copyText(){const c=byId[st.chosen];let text=t('copyChoice',{round:DATA.round?t('copyRound',{round:DATA.round}):'',number:no(c),name:c.name});return text;}
 async function copy(t=copyText()){
  let ok=false;
  try{await navigator.clipboard.writeText(t);ok=true;}catch{const a=el('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;opacity:0';document.body.append(a);a.select();try{ok=document.execCommand('copy');}catch{}a.remove();}
  toast(ok,t);
 }
 function toast(ok,text){
  const n=$('#toast');n.toggleAttribute('data-fail',!ok);n.querySelector('b').textContent=ok?t('copied'):t('copyFailed');n.querySelector('code').textContent=ok?text.replace(/\n/g,' · '):text;
  n.classList.remove('show');n.offsetWidth;n.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.classList.remove('show'),ok?2400:8000);
 }

 $$('button[data-layout]').forEach(b=>b.addEventListener('click',()=>setLayout(b.dataset.layout)));
 $$('button[data-viewport]').forEach(b=>b.addEventListener('click',()=>{if(st.viewport===b.dataset.viewport)return;st.viewport=b.dataset.viewport;save();morph(render,'reshape');}));
 // 每个候选都声明了固定画布时，桌面和手机的切换不起作用，收起来。
 if(C.every(c=>c.nativeViewport))$('[data-i18n-aria-label="viewportLabel"]').style.display='none';
 $('#prev').addEventListener('click',()=>step(-1));$('#next').addEventListener('click',()=>step(1));
 document.addEventListener('keydown',e=>{
  if(e.target.closest?.('textarea,input,summary')||e.metaKey||e.ctrlKey||e.altKey||st.layout!=='loupe')return;
  if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1);else if(e.key==='Escape')setLayout('compare');else if(e.key.toLowerCase()==='p')choose(st.current);
 });
 function syncBars(){root.style.setProperty('--bar-h',`${$('#bar').offsetHeight}px`);placeThumbs(true);placeFilm(true);refit();}
 window.addEventListener('resize',syncBars,{passive:true});
 document.fonts?.ready.then(()=>{placeThumbs(true);placeFilm(true);});
 $('#bar').hidden=false;
 if(st.layout==='compare'){$('#grid').classList.add('first');$('.intro').classList.add('first');setTimeout(()=>{$('#grid').classList.remove('first');$('.intro').classList.remove('first');},1400);}
 render();syncBars();
 if(services.size){checkServices();setInterval(()=>{if(!document.hidden)checkServices();},5000);window.addEventListener('focus',checkServices);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkServices();});}
})();
</script></body></html>
