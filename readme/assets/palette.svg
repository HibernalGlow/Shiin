<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="palette-title palette-desc">
  <title id="palette-title">Shiin 的印象色板：取自《明日方舟》稀音</title>
  <desc id="palette-desc">六种颜色：暗房墨黑、银白、荧光黄绿、苔绿、领带绯红与木槿淡粉；荧光黄绿同时对应应用界面的 lime token。</desc>

  <rect width="1200" height="380" fill="#0C0E09" />
  <rect x="20.5" y="20.5" width="1159" height="339" rx="2" fill="none" stroke="#242C1D" stroke-width="1" />

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
    <text x="64" y="62" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="16" letter-spacing="2.4" fill="#C9F56D">IMPRESSION / 印象色</text>
    <text x="64" y="116" font-size="44" font-weight="750" fill="#EDE5D3">SCENE / R162</text>
    <text x="64" y="150" font-size="20" fill="#AEB6A1">稀音 · 战场摄影师 · 银发、琥珀瞳、苔绿与荧光黄绿</text>
    <text x="1136" y="62" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="15" letter-spacing="1.2" fill="#7E8874" text-anchor="end">AFTER OFFICIAL ART</text>
    <text x="1136" y="150" font-size="16" fill="#7E8874" text-anchor="end">不是官方品牌规范，是立绘印象色的项目化转译。</text>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
    <g transform="translate(64 178)">
      <rect width="168" height="96" rx="12" fill="#0C0E09" stroke="#3A4430" stroke-width="1.4" />
      <text x="0" y="126" font-size="18" font-weight="700" fill="#EDE5D3">INK / 暗房</text>
      <text x="0" y="150" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="17" fill="#AEB6A1">#0C0E09</text>
      <text x="0" y="172" font-size="14" fill="#7E8874">页面与取景器</text>
    </g>

    <g transform="translate(244 178)">
      <rect width="168" height="96" rx="12" fill="#EDE5D3" />
      <text x="0" y="126" font-size="18" font-weight="700" fill="#EDE5D3">SILVER / 银发</text>
      <text x="0" y="150" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="17" fill="#AEB6A1">#EDE5D3</text>
      <text x="0" y="172" font-size="14" fill="#7E8874">前景与标题</text>
    </g>

    <g transform="translate(424 178)">
      <rect width="168" height="96" rx="12" fill="#C9F56D" />
      <rect y="86" width="168" height="10" rx="5" fill="#D5EE13" />
      <text x="0" y="126" font-size="18" font-weight="700" fill="#EDE5D3">LIME / 主色</text>
      <text x="0" y="150" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="17" fill="#AEB6A1">#C9F56D</text>
      <text x="0" y="172" font-size="14" fill="#7E8874">界面 token · 立绘高亮</text>
    </g>

    <g transform="translate(604 178)">
      <rect width="168" height="96" rx="12" fill="#8A9A5B" />
      <text x="0" y="126" font-size="18" font-weight="700" fill="#EDE5D3">MOSS / 苔绿</text>
      <text x="0" y="150" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="17" fill="#AEB6A1">#8A9A5B</text>
      <text x="0" y="172" font-size="14" fill="#7E8874">摄影包与枯枝</text>
    </g>

    <g transform="translate(784 178)">
      <rect width="168" height="96" rx="12" fill="#A82F46" />
      <text x="0" y="126" font-size="18" font-weight="700" fill="#EDE5D3">CRIMSON / 领带</text>
      <text x="0" y="150" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="17" fill="#AEB6A1">#A82F46</text>
      <text x="0" y="172" font-size="14" fill="#7E8874">警示与点缀</text>
    </g>

    <g transform="translate(964 178)">
      <rect width="168" height="96" rx="12" fill="#E7C7C8" />
      <text x="0" y="126" font-size="18" font-weight="700" fill="#EDE5D3">BLOSSOM / 木槿</text>
      <text x="0" y="150" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="17" fill="#AEB6A1">#E7C7C8</text>
      <text x="0" y="172" font-size="14" fill="#7E8874">E2 立绘的淡粉花</text>
    </g>
  </g>
</svg>
