<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="hub-en-title hub-en-desc">
  <title id="hub-en-title">Shiin capture hub: profiles, inbox, rules and insights</title>
  <desc id="hub-en-desc">Four capabilities: capture profiles define presets along matching, privacy, metadata and pipeline dimensions; the inbox tracks inbox, starred, archived and trashed states with batch operations; the rule engine maps conditions to tagging, starring, archiving and moving actions with dry-run preview and undo rollback, while captures cluster into sessions by time window; insights cover screenshot, listening and button events, shooting streaks, dHash duplicate groups and multi-vault storage health. The footer states the current boundary: core engines and tests are landed, the UI entry sits behind the Capture Hub toggle in settings, the inbox still renders demo items, and the indexed library is core-only.</desc>

  <defs>
    <marker id="hub-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#C9F56D" />
    </marker>
  </defs>

  <rect width="1200" height="470" fill="#0C0E09" />
  <rect x="20.5" y="20.5" width="1159" height="430" rx="2" fill="none" stroke="#242C1D" stroke-width="1" />

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="64" y="66" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="16" letter-spacing="2.4" fill="#C9F56D">HUB / FROM SHOT TO LIBRARY</text>
    <text x="64" y="118" font-size="42" font-weight="750" fill="#EDE5D3">The capture hub: from shots to assets</text>
    <text x="64" y="152" font-size="20" fill="#9AA28E">Engines and tests live in core; the UI entry sits behind a toggle in settings.</text>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <rect x="64" y="190" width="250" height="178" rx="16" fill="#12160F" stroke="#2D3526" stroke-width="1.2" />
    <text x="82" y="218" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="14" letter-spacing="1.4" fill="#7E8874">01 / PROFILE</text>
    <text x="82" y="252" font-size="24" font-weight="700" fill="#EDE5D3">Profiles</text>
    <g font-size="16" fill="#AEB6A1">
      <text x="82" y="284">Gaming / Development</text>
      <text x="82" y="310">Research / Design</text>
      <text x="82" y="336">custom profiles</text>
      <text x="82" y="362">four orthogonal axes</text>
    </g>

    <rect x="332" y="190" width="250" height="178" rx="16" fill="#1A2113" stroke="#C9F56D" stroke-width="1.6" />
    <text x="350" y="218" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="14" letter-spacing="1.4" fill="#C9F56D">02 / INBOX</text>
    <text x="350" y="252" font-size="24" font-weight="700" fill="#EDE5D3">Inbox</text>
    <g font-size="16" fill="#AEB6A1">
      <text x="350" y="284">inbox / starred</text>
      <text x="350" y="310">archived / trashed</text>
      <text x="350" y="336">batch operations</text>
      <text x="350" y="362">indexed queries</text>
    </g>

    <rect x="600" y="190" width="250" height="178" rx="16" fill="#12160F" stroke="#2D3526" stroke-width="1.2" />
    <text x="618" y="218" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="14" letter-spacing="1.4" fill="#7E8874">03 / AUTOMATE</text>
    <text x="618" y="252" font-size="24" font-weight="700" fill="#EDE5D3">Rules</text>
    <g font-size="16" fill="#AEB6A1">
      <text x="618" y="284">match app / title</text>
      <text x="618" y="310">tag, star, archive</text>
      <text x="618" y="336">dry-run + undo</text>
      <text x="618" y="362">session clustering</text>
    </g>

    <rect x="868" y="190" width="250" height="178" rx="16" fill="#12160F" stroke="#2D3526" stroke-width="1.2" />
    <text x="886" y="218" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="14" letter-spacing="1.4" fill="#7E8874">04 / INSIGHT</text>
    <text x="886" y="252" font-size="24" font-weight="700" fill="#EDE5D3">Insights</text>
    <g font-size="16" fill="#AEB6A1">
      <text x="886" y="284">captures / listening</text>
      <text x="886" y="310">button press streaks</text>
      <text x="886" y="336">dHash duplicates</text>
      <text x="886" y="362">vault health checks</text>
    </g>
  </g>

  <g stroke="#C9F56D" stroke-width="2" marker-end="url(#hub-en-arrow)">
    <line x1="316" y1="279" x2="328" y2="279" />
    <line x1="584" y1="279" x2="596" y2="279" />
    <line x1="852" y1="279" x2="864" y2="279" />
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="64" y="398" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="15" letter-spacing="1.6" fill="#A82F46">STATUS / CURRENT BOUNDARY</text>
    <text x="1136" y="398" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="15" letter-spacing="1" fill="#7E8874" text-anchor="end">docs/adr/0011 · 0012</text>
    <g font-size="15" fill="#AEB6A1">
      <rect x="64" y="408" width="250" height="40" rx="11" fill="#12160F" stroke="#A82F46" stroke-width="1.1" stroke-dasharray="5 4" />
      <text x="82" y="433">engine + tests landed</text>
      <rect x="332" y="408" width="250" height="40" rx="11" fill="#12160F" stroke="#A82F46" stroke-width="1.1" stroke-dasharray="5 4" />
      <text x="350" y="433">toggle off by default</text>
      <rect x="600" y="408" width="250" height="40" rx="11" fill="#12160F" stroke="#A82F46" stroke-width="1.1" stroke-dasharray="5 4" />
      <text x="618" y="433">inbox shows demo items</text>
      <rect x="868" y="408" width="250" height="40" rx="11" fill="#12160F" stroke="#A82F46" stroke-width="1.1" stroke-dasharray="5 4" />
      <text x="886" y="433">library is core-only</text>
    </g>
  </g>
</svg>
